name: v0.3.x CI

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Python tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Python compile
        run: python -m py_compile server/app/*.py server/remote-gate.py tests/*.py

      - name: Shell syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in openwrt/*.sh openwrt/*.init; do
            sh -n "$file"
          done
          for file in server/*.sh; do
            bash -n "$file"
          done

      - name: JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in server/app/static/js/*.js tests/*.mjs; do
            node --check "$file"
          done

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Chromium test runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser || sudo apt-get install -y chromium

      - name: Start fixture server
        run: |
          python tests/ui_fixture_server.py > /tmp/remote-gate-ui-fixture.log 2>&1 &
          echo $! > /tmp/remote-gate-ui-fixture.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/remote-gate-ui-fixture.log
          exit 1

      - name: Browser layout regression
        run: node tests/browser_layout.mjs

      - name: Stop fixture server
        if: always()
        run: |
          if [ -f /tmp/remote-gate-ui-fixture.pid ]; then
            kill "$(cat /tmp/remote-gate-ui-fixture.pid)" 2>/dev/null || true
          fi
