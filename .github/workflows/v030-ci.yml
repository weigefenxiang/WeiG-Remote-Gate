name: v0.3.x CI

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Python tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Python compile
        run: python -m py_compile server/app/*.py server/remote-gate.py tests/*.py

      - name: Shell syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in openwrt/*.sh openwrt/*.init native/*.sh; do
            sh -n "$file"
          done
          for file in server/*.sh; do
            bash -n "$file"
          done

      - name: Native mapper host build
        run: make -C native clean all check

      - name: JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in server/app/static/js/*.js; do
            node --check "$file"
          done
          node --check tests/browser_layout.mjs
          node --check tests/browser_split_dual.mjs
