name: v0.3.x CI

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Python tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Python compile
        run: python -m py_compile server/app/*.py server/remote-gate.py tests/*.py

      - name: Shell syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in openwrt/*.sh openwrt/*.init native/*.sh; do
            sh -n "$file"
          done
          for file in server/*.sh; do
            bash -n "$file"
          done

      - name: Native mapper build
        run: make -C native clean all check

      - name: JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in server/app/static/js/*.js; do
            node --check "$file"
          done
          node --check tests/browser_layout.mjs

  native-cross:
    runs-on: ubuntu-latest
    needs: core
    steps:
      - uses: actions/checkout@v4

      - name: Install verified Zig 0.16.0
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz -o /tmp/zig.tar.xz
          echo '70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00  /tmp/zig.tar.xz' | sha256sum -c -
          mkdir -p .zig
          tar -xJf /tmp/zig.tar.xz --strip-components=1 -C .zig
          .zig/zig version

      - name: Install QEMU user emulation
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-user file

      - name: Cross build all portable mapper classes
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p native/dist
          : > /tmp/mapper-cross-failures
          while IFS=$'\t' read -r class target cflags validation; do
            [[ -n "$class" && "$class" != \#* ]] || continue
            [[ "$validation" == 'cross-build' ]] || continue
            echo "::group::Build $class -> $target"
            if ! ZIG="$PWD/.zig/zig" OUT_DIR="$PWD/native/dist" sh native/build-portable.sh "$class"; then
              echo "build:$class" | tee -a /tmp/mapper-cross-failures
            fi
            echo '::endgroup::'
          done < native/mapper-build-classes.tsv

      - name: QEMU smoke all built mapper classes
        shell: bash
        run: |
          set -uo pipefail
          while IFS=$'\t' read -r class target cflags validation; do
            [[ -n "$class" && "$class" != \#* ]] || continue
            [[ "$validation" == 'cross-build' ]] || continue
            binary="native/dist/remote-gate-mapper-$class"
            [[ -x "$binary" ]] || continue
            echo "::group::Smoke $class"
            if ! sh native/smoke-portable.sh "$class" "$binary"; then
              echo "smoke:$class" | tee -a /tmp/mapper-cross-failures
            fi
            echo '::endgroup::'
          done < native/mapper-build-classes.tsv

      - name: Upload successful mapper cross candidates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: remote-gate-mapper-cross-candidates-${{ github.sha }}
          path: native/dist/remote-gate-mapper-*
          if-no-files-found: error
          retention-days: 14

      - name: Enforce complete portable mapper coverage
        shell: bash
        run: |
          set -euo pipefail
          if [[ -s /tmp/mapper-cross-failures ]]; then
            echo 'Portable mapper failures:' >&2
            sort -u /tmp/mapper-cross-failures >&2
            exit 1
          fi
          echo 'All portable mapper classes built and passed architecture smoke tests.'

  legacy-sdk-smoke:
    runs-on: ubuntu-latest
    needs: core
    steps:
      - uses: actions/checkout@v4

      - name: Download verified LEDE 17.01.7 SDK
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL \
            https://downloads.openwrt.org/releases/17.01.7/targets/x86/64/lede-sdk-17.01.7-x86-64_gcc-5.4.0_musl-1.1.16.Linux-x86_64.tar.xz \
            -o /tmp/lede-sdk.tar.xz
          echo 'dc8814263db97e563fe620774295f78bab0fb726cf39829f1b937b7b01bac5a0  /tmp/lede-sdk.tar.xz' | sha256sum -c -
          mkdir -p .lede-sdk
          tar -xJf /tmp/lede-sdk.tar.xz --strip-components=1 -C .lede-sdk

      - name: Build mapper with LEDE SDK
        shell: bash
        run: |
          set -euo pipefail
          sh native/build-openwrt-sdk.sh "$PWD/.lede-sdk" x86_64 "$PWD/native/dist-sdk"
          test -x native/dist-sdk/remote-gate-mapper-x86_64

      - name: Smoke LEDE SDK mapper
        shell: bash
        run: |
          set -euo pipefail
          set +e
          native/dist-sdk/remote-gate-mapper-x86_64 > /tmp/lede-sdk-mapper.log 2>&1
          status=$?
          set -e
          cat /tmp/lede-sdk-mapper.log
          test "$status" -eq 2
          grep -q '^usage:' /tmp/lede-sdk-mapper.log

      - name: Upload LEDE SDK candidate
        uses: actions/upload-artifact@v4
        with:
          name: remote-gate-mapper-lede-17.01.7-x86_64-${{ github.sha }}
          path: native/dist-sdk/remote-gate-mapper-x86_64
          if-no-files-found: error
          retention-days: 14

  browser:
    runs-on: ubuntu-latest
    needs: core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Chromium test runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start fixture server
        run: |
          python tests/ui_fixture_server.py > /tmp/remote-gate-ui-fixture.log 2>&1 &
          echo $! > /tmp/remote-gate-ui-fixture.pid
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8765/healthz >/dev/null && exit 0
            sleep 0.5
          done
          cat /tmp/remote-gate-ui-fixture.log
          exit 1

      - name: Browser layout regression
        run: node tests/browser_layout.mjs

      - name: Stop fixture server
        if: always()
        run: |
          [ -f /tmp/remote-gate-ui-fixture.pid ] && kill "$(cat /tmp/remote-gate-ui-fixture.pid)" 2>/dev/null || true
          cat /tmp/remote-gate-ui-fixture.log 2>/dev/null || true
