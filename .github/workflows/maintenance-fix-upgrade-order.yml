name: Maintenance - fix OpenWrt upgrade order

on:
  push:
    branches:
      - dev/v0.3.1

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'chore: apply OpenWrt upgrade-order maintenance'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/v0.3.1
          fetch-depth: 0
      - name: Patch upgrade ordering and verifier diagnostics
        shell: python3 {0}
        run: |
          from pathlib import Path

          updater = Path('openwrt/update.sh')
          s = updater.read_text(encoding='utf-8')
          old = '''"$LIB_DIR/remote-gate-firewall.sh" install >/dev/null || fail "Firewall integration failed."
          "$LIB_DIR/remote-gate-agent.sh" sync-firewall || fail "Dual-stack firewall policy sync failed."
          status="$("$LIB_DIR/remote-gate-firewall.sh" status-json 2>/dev/null || true)"
          '''
          new = '''# Normalize v0.3 policy state before install-time verification. Legacy or
          # interrupted upgrades may leave state files that do not match the migrated
          # GATE_IPV6 / current WAN policy yet. The sync path rebuilds policy directly
          # and does not depend on the install-time verifier.
          "$LIB_DIR/remote-gate-agent.sh" sync-firewall || fail "Pre-install firewall policy sync failed."
          "$LIB_DIR/remote-gate-firewall.sh" install >/dev/null || fail "Firewall integration failed."
          "$LIB_DIR/remote-gate-agent.sh" sync-firewall || fail "Post-install firewall policy sync failed."
          status="$("$LIB_DIR/remote-gate-firewall.sh" status-json 2>/dev/null || true)"
          '''
          if s.count(old) != 1:
              raise SystemExit('updater install/sync block not found exactly once')
          updater.write_text(s.replace(old, new), encoding='utf-8')

          fw = Path('openwrt/remote-gate-firewall.sh')
          s = fw.read_text(encoding='utf-8')
          old = '''fw3_verify() {
              iptables -C INPUT -j "$FW3_CHAIN_V4" >/dev/null 2>&1 || return 1
              first_rule="$(iptables -S INPUT | awk '$1 == "-A" && $2 == "INPUT" { print; exit }')"
              [ "$first_rule" = "-A INPUT -j $FW3_CHAIN_V4" ] || return 1
              if [ -s "$DEVICES_V6_FILE" ]; then
                  fw3_ipv6_capable || return 1
                  ip6tables -C INPUT -j "$FW3_CHAIN_V6" >/dev/null 2>&1 || return 1
                  first_rule6="$(ip6tables -S INPUT | awk '$1 == "-A" && $2 == "INPUT" { print; exit }')"
                  [ "$first_rule6" = "-A INPUT -j $FW3_CHAIN_V6" ] || return 1
              elif command -v ip6tables >/dev/null 2>&1; then
                  ip6tables -C INPUT -j "$FW3_CHAIN_V6" >/dev/null 2>&1 && return 1
              fi
          }
          '''
          new = '''fw3_verify() {
              if ! iptables -C INPUT -j "$FW3_CHAIN_V4" >/dev/null 2>&1; then
                  printf 'ERROR: fw3 verify: IPv4 INPUT jump is missing.\\n' >&2
                  return 1
              fi
              first_rule="$(iptables -S INPUT | awk '$1 == "-A" && $2 == "INPUT" { print; exit }')"
              if [ "$first_rule" != "-A INPUT -j $FW3_CHAIN_V4" ]; then
                  printf 'ERROR: fw3 verify: first IPv4 INPUT rule is: %s\\n' "$first_rule" >&2
                  return 1
              fi
              if [ -s "$DEVICES_V6_FILE" ]; then
                  if ! fw3_ipv6_capable; then
                      printf 'ERROR: fw3 verify: IPv6 policy exists but inet6 firewall support is unavailable.\\n' >&2
                      return 1
                  fi
                  if ! ip6tables -C INPUT -j "$FW3_CHAIN_V6" >/dev/null 2>&1; then
                      printf 'ERROR: fw3 verify: IPv6 INPUT jump is missing.\\n' >&2
                      return 1
                  fi
                  first_rule6="$(ip6tables -S INPUT | awk '$1 == "-A" && $2 == "INPUT" { print; exit }')"
                  if [ "$first_rule6" != "-A INPUT -j $FW3_CHAIN_V6" ]; then
                      printf 'ERROR: fw3 verify: first IPv6 INPUT rule is: %s\\n' "$first_rule6" >&2
                      return 1
                  fi
              elif command -v ip6tables >/dev/null 2>&1; then
                  if ip6tables -C INPUT -j "$FW3_CHAIN_V6" >/dev/null 2>&1; then
                      printf 'ERROR: fw3 verify: idle IPv6 INPUT jump remains while IPv6 policy is empty.\\n' >&2
                      return 1
                  fi
              fi
          }
          '''
          if s.count(old) != 1:
              raise SystemExit('fw3_verify block not found exactly once')
          fw.write_text(s.replace(old, new), encoding='utf-8')

          test = Path('tests/test_firewall_backends.py')
          s = test.read_text(encoding='utf-8')
          marker = '    def test_scope_can_keep_ping_closed(self):\n'
          addition = (
              '    def test_updater_normalizes_policy_before_fw3_install_verify(self):\n'
              '        source = UPDATE.read_text(encoding="utf-8")\n'
              '        pre = source.index(\'sync-firewall || fail "Pre-install firewall policy sync failed."\')\n'
              '        install = source.index(\'remote-gate-firewall.sh" install\')\n'
              '        post = source.index(\'sync-firewall || fail "Post-install firewall policy sync failed."\')\n'
              '        self.assertLess(pre, install)\n'
              '        self.assertLess(install, post)\n\n'
              '    def test_fw3_verifier_reports_family_specific_failures(self):\n'
              '        source = FIREWALL.read_text(encoding="utf-8")\n'
              '        self.assertIn("fw3 verify: IPv4 INPUT jump is missing", source)\n'
              '        self.assertIn("fw3 verify: first IPv4 INPUT rule is", source)\n'
              '        self.assertIn("fw3 verify: IPv6 INPUT jump is missing", source)\n'
              '        self.assertIn("fw3 verify: first IPv6 INPUT rule is", source)\n\n'
          )
          if 'test_updater_normalizes_policy_before_fw3_install_verify' in s:
              raise SystemExit('upgrade-order test already exists')
          if s.count(marker) != 1:
              raise SystemExit('test insertion marker not found exactly once')
          test.write_text(s.replace(marker, addition + marker), encoding='utf-8')

          Path('.github/workflows/maintenance-fix-upgrade-order.yml').unlink()
      - name: Validate patch
        run: |
          sh -n openwrt/update.sh
          sh -n openwrt/remote-gate-firewall.sh
          python3 -m unittest tests.test_firewall_backends
      - name: Commit patch
        run: |
          git config user.name "weigefenxiang"
          git config user.email "119787190+weigefenxiang@users.noreply.github.com"
          git add -A
          git commit -m "fix: normalize OpenWrt policy before firewall verification"
          git push origin HEAD:dev/v0.3.1
