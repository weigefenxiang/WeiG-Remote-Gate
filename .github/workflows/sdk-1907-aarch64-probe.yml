name: SDK 19.07 AArch64 probe

on:
  push:
    branches:
      - dev

permissions:
  contents: read

jobs:
  sdk-1907-aarch64-probe:
    if: contains(github.event.head_commit.message, '[sdk-1907-aarch64-once]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install SDK runtime tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xz-utils file qemu-user binutils

      - name: Build and smoke OpenWrt 19.07.9 AArch64
        shell: bash
        run: |
          set -euo pipefail
          sh native/run-sdk-compat.sh openwrt-19.07.9-armvirt-64 "$PWD/native/dist-sdk-aarch64"
          binary="$PWD/native/dist-sdk-aarch64/remote-gate-mapper-aarch64_generic"
          file "$binary"
          readelf -h "$binary"
          readelf -lW "$binary"
          readelf -n "$binary" || true
          sha256sum "$binary"

      - name: Upload OpenWrt 19.07.9 AArch64 candidate
        uses: actions/upload-artifact@v4
        with:
          name: remote-gate-mapper-openwrt-19.07.9-aarch64-${{ github.sha }}
          path: native/dist-sdk-aarch64/remote-gate-mapper-aarch64_generic
          if-no-files-found: error
          retention-days: 14
