name: Browser Matrix Core

on:
  workflow_call:

permissions:
  contents: read

jobs:
  browser-matrix:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux browser matrix
            os: ubuntu-latest
          - name: Windows browser matrix
            os: windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Verify exact candidate SHA
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$GITHUB_SHA"
          printf 'browser_candidate_sha=%s\n' "$actual"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Chromium test runtime
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.55.0
          npx playwright install chromium

      - name: Start fixture server (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          python tests/ui_fixture_server.py > "$RUNNER_TEMP/remote-gate-ui-fixture.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/remote-gate-ui-fixture.pid"
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8765/healthz >/dev/null && exit 0
            sleep 0.5
          done
          cat "$RUNNER_TEMP/remote-gate-ui-fixture.log"
          exit 1

      - name: Windows browser matrix with fixture
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stdout = Join-Path $env:RUNNER_TEMP 'remote-gate-ui-fixture.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'remote-gate-ui-fixture.err'
          $process = Start-Process python -ArgumentList 'tests/ui_fixture_server.py' -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
          try {
            $healthy = $false
            for ($i = 0; $i -lt 20; $i++) {
              try {
                Invoke-WebRequest -UseBasicParsing -Uri 'http://127.0.0.1:8765/healthz' | Out-Null
                $healthy = $true
                break
              } catch {
                Start-Sleep -Milliseconds 500
              }
            }
            if (-not $healthy) { throw 'Windows fixture did not become healthy' }

            & node tests/browser_layout.mjs
            if ($LASTEXITCODE -ne 0) { throw 'browser_layout.mjs failed' }
            & node tests/browser_access_pathcard.mjs
            if ($LASTEXITCODE -ne 0) { throw 'browser_access_pathcard.mjs failed' }
            & node tests/browser_split_dual.mjs
            if ($LASTEXITCODE -ne 0) { throw 'browser_split_dual.mjs failed' }
            & node tests/browser_plan_preferences.mjs
            if ($LASTEXITCODE -ne 0) { throw 'browser_plan_preferences.mjs failed' }
            & node tests/browser_plan_service_identity.mjs
            if ($LASTEXITCODE -ne 0) { throw 'browser_plan_service_identity.mjs failed' }
            & node tests/browser_gate_profile_binding.mjs
            if ($LASTEXITCODE -ne 0) { throw 'browser_gate_profile_binding.mjs failed' }
            & node tests/browser_egress_manual.mjs
            if ($LASTEXITCODE -ne 0) { throw 'browser_egress_manual.mjs failed' }
            & node tests/browser_mixed_egress.mjs
            if ($LASTEXITCODE -ne 0) { throw 'browser_mixed_egress.mjs failed' }
          } finally {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            if (Test-Path $stdout) { Get-Content $stdout }
            if (Test-Path $stderr) { Get-Content $stderr }
          }

      - name: Browser layout regression
        if: runner.os == 'Linux'
        run: node tests/browser_layout.mjs

      - name: Access PathCard browser regression
        if: runner.os == 'Linux'
        run: node tests/browser_access_pathcard.mjs

      - name: Split WAN Dual browser regression
        if: runner.os == 'Linux'
        run: node tests/browser_split_dual.mjs

      - name: Manual endpoint preference regression
        if: runner.os == 'Linux'
        run: node tests/browser_plan_preferences.mjs

      - name: WireGuard-bound endpoint preference regression
        if: runner.os == 'Linux'
        run: node tests/browser_plan_service_identity.mjs

      - name: Gate access profile binding regression
        if: runner.os == 'Linux'
        run: node tests/browser_gate_profile_binding.mjs

      - name: Manual Internet exit regression
        if: runner.os == 'Linux'
        run: node tests/browser_egress_manual.mjs

      - name: Mixed Access and Internet exit regression
        if: runner.os == 'Linux'
        run: node tests/browser_mixed_egress.mjs

      - name: Stop fixture server (Linux)
        if: always() && runner.os == 'Linux'
        shell: bash
        run: |
          [ -f "$RUNNER_TEMP/remote-gate-ui-fixture.pid" ] && kill "$(cat "$RUNNER_TEMP/remote-gate-ui-fixture.pid")" 2>/dev/null || true
          cat "$RUNNER_TEMP/remote-gate-ui-fixture.log" 2>/dev/null || true
