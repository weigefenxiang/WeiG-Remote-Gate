name: Browser Matrix Core

on:
  workflow_call:

permissions:
  contents: read

jobs:
  browser-matrix:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux browser matrix
            os: ubuntu-latest
          - name: Windows browser matrix
            os: windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Verify exact candidate SHA
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$GITHUB_SHA"
          printf 'browser_candidate_sha=%s\n' "$actual"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Chromium test runtime
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.55.0
          npx playwright install chromium

      - name: Start fixture server (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          python tests/ui_fixture_server.py > "$RUNNER_TEMP/remote-gate-ui-fixture.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/remote-gate-ui-fixture.pid"
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8765/healthz >/dev/null && exit 0
            sleep 0.5
          done
          cat "$RUNNER_TEMP/remote-gate-ui-fixture.log"
          exit 1

      - name: Start fixture server (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $stdout = Join-Path $env:RUNNER_TEMP 'remote-gate-ui-fixture.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'remote-gate-ui-fixture.err'
          $pidFile = Join-Path $env:RUNNER_TEMP 'remote-gate-ui-fixture.pid'
          $runnerTrackingId = $env:RUNNER_TRACKING_ID
          try {
            Remove-Item Env:RUNNER_TRACKING_ID -ErrorAction SilentlyContinue
            $process = Start-Process python -ArgumentList 'tests/ui_fixture_server.py' -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
          } finally {
            if ($null -ne $runnerTrackingId) { $env:RUNNER_TRACKING_ID = $runnerTrackingId }
          }
          Set-Content -Path $pidFile -Value $process.Id
          for ($i = 0; $i -lt 20; $i++) {
            try {
              Invoke-WebRequest -UseBasicParsing -Uri 'http://127.0.0.1:8765/healthz' | Out-Null
              exit 0
            } catch {
              Start-Sleep -Milliseconds 500
            }
          }
          if (Test-Path $stdout) { Get-Content $stdout }
          if (Test-Path $stderr) { Get-Content $stderr }
          exit 1

      - name: Verify fixture survives Windows step boundary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          for ($i = 0; $i -lt 10; $i++) {
            try {
              Invoke-WebRequest -UseBasicParsing -Uri 'http://127.0.0.1:8765/healthz' | Out-Null
              exit 0
            } catch {
              Start-Sleep -Milliseconds 250
            }
          }
          $stdout = Join-Path $env:RUNNER_TEMP 'remote-gate-ui-fixture.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'remote-gate-ui-fixture.err'
          if (Test-Path $stdout) { Get-Content $stdout }
          if (Test-Path $stderr) { Get-Content $stderr }
          exit 1

      - name: Browser layout regression
        run: node tests/browser_layout.mjs

      - name: Access PathCard browser regression
        run: node tests/browser_access_pathcard.mjs

      - name: Split WAN Dual browser regression
        run: node tests/browser_split_dual.mjs

      - name: Manual endpoint preference regression
        run: node tests/browser_plan_preferences.mjs

      - name: WireGuard-bound endpoint preference regression
        run: node tests/browser_plan_service_identity.mjs

      - name: Gate access profile binding regression
        run: node tests/browser_gate_profile_binding.mjs

      - name: Manual Internet exit regression
        run: node tests/browser_egress_manual.mjs

      - name: Mixed Access and Internet exit regression
        run: node tests/browser_mixed_egress.mjs

      - name: Stop fixture server (Linux)
        if: always() && runner.os == 'Linux'
        shell: bash
        run: |
          [ -f "$RUNNER_TEMP/remote-gate-ui-fixture.pid" ] && kill "$(cat "$RUNNER_TEMP/remote-gate-ui-fixture.pid")" 2>/dev/null || true
          cat "$RUNNER_TEMP/remote-gate-ui-fixture.log" 2>/dev/null || true

      - name: Stop fixture server (Windows)
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          $pidFile = Join-Path $env:RUNNER_TEMP 'remote-gate-ui-fixture.pid'
          $stdout = Join-Path $env:RUNNER_TEMP 'remote-gate-ui-fixture.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'remote-gate-ui-fixture.err'
          if (Test-Path $pidFile) {
            $fixturePid = Get-Content $pidFile
            Stop-Process -Id $fixturePid -Force -ErrorAction SilentlyContinue
          }
          if (Test-Path $stdout) { Get-Content $stdout }
          if (Test-Path $stderr) { Get-Content $stderr }
