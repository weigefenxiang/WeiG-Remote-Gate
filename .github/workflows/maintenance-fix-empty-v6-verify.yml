name: Maintenance - fix empty IPv6 verifier

on:
  push:
    branches:
      - dev/v0.3.1

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/v0.3.1
          fetch-depth: 0
      - name: Patch verifier and regression
        run: |
          python3 <<'PY'
          from pathlib import Path

          fw = Path('openwrt/remote-gate-firewall.sh')
          s = fw.read_text(encoding='utf-8')
          old = '    elif command -v ip6tables >/dev/null 2>&1; then\n        ip6tables -C INPUT -j "$FW3_CHAIN_V6" >/dev/null 2>&1 && return 1\n    fi\n}\n'
          new = '    elif command -v ip6tables >/dev/null 2>&1; then\n        if ip6tables -C INPUT -j "$FW3_CHAIN_V6" >/dev/null 2>&1; then\n            return 1\n        fi\n    fi\n    return 0\n}\n'
          if s.count(old) != 1:
              raise SystemExit(f'empty IPv6 verifier block count={s.count(old)}')
          fw.write_text(s.replace(old, new), encoding='utf-8')

          test = Path('tests/test_firewall_backends.py')
          s = test.read_text(encoding='utf-8')
          old = '        self.assertIn(\'ip6tables -C INPUT -j "$FW3_CHAIN_V6" >/dev/null 2>&1 && return 1\', source)\n'
          new = '        self.assertIn(\'if ip6tables -C INPUT -j "$FW3_CHAIN_V6" >/dev/null 2>&1; then\', source)\n        self.assertIn(\'    return 1\\n        fi\\n    fi\\n    return 0\', source)\n'
          if s.count(old) != 1:
              raise SystemExit(f'empty IPv6 test assertion count={s.count(old)}')
          test.write_text(s.replace(old, new), encoding='utf-8')

          Path('.github/workflows/maintenance-fix-empty-v6-verify.yml').unlink()
          PY
      - name: Validate patch
        run: |
          sh -n openwrt/remote-gate-firewall.sh
          python3 -m unittest tests.test_firewall_backends
      - name: Commit patch
        run: |
          git config user.name "weigefenxiang"
          git config user.email "119787190+weigefenxiang@users.noreply.github.com"
          git add -A
          git commit -m "fix: return success for empty IPv6 fw3 policy"
          git push origin HEAD:dev/v0.3.1
