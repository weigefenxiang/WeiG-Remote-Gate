name: SDK Compatibility (manual)

on:
  workflow_dispatch:
  push:
    branches:
      - dev
    paths:
      - '.github/workflows/sdk-compat.yml'

permissions:
  contents: read

concurrency:
  group: sdk-compat-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sdk-build:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[sdk-1907-reverify]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        sample:
          - openwrt-19.07.10-x86_64
    steps:
      - uses: actions/checkout@v4

      - name: Install SDK archive tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xz-utils zstd file

      - name: Build and smoke SDK mapper
        shell: bash
        run: |
          set -euo pipefail
          sh native/run-sdk-compat.sh "${{ matrix.sample }}" "$PWD/native/dist-sdk"

      - name: Upload SDK candidate
        uses: actions/upload-artifact@v4
        with:
          name: remote-gate-mapper-${{ matrix.sample }}-${{ github.sha }}
          path: native/dist-sdk/remote-gate-mapper-x86_64
          if-no-files-found: error
          retention-days: 14
