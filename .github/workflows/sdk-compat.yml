name: SDK Compatibility (manual)

on:
  workflow_dispatch:
    inputs:
      sample:
        description: SDK sample to validate
        required: true
        default: all
        type: choice
        options:
          - all
          - openwrt-19.07.9-armvirt-64
          - openwrt-19.07.10-x86_64
          - openwrt-19.07.10-x86-geode
          - openwrt-19.07.10-ramips-mt76x8
          - openwrt-19.07.10-ar71xx-generic
          - openwrt-21.02.7-x86_64
          - openwrt-24.10.5-x86_64
          - openwrt-25.12.5-x86_64
          - immortalwrt-24.10.5-x86_64
  push:
    branches:
      - dev

permissions:
  contents: read

concurrency:
  group: sdk-compat-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sdk-1907-x86-series-probe-once:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[sdk-1907-x86-series]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install SDK runtime tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xz-utils zstd file qemu-user

      - name: Probe OpenWrt 19.07.9 x86_64 without build-id workaround
        shell: bash
        run: |
          set -euo pipefail
          matrix="$RUNNER_TEMP/sdk-compat-19079-x86.tsv"
          cp native/sdk-compat-matrix.tsv "$matrix"
          printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\n' \
            'openwrt-19.07.9-x86_64' \
            'openwrt' \
            '19.07.9' \
            'x86/64' \
            'x86_64' \
            'xz' \
            '1e466277a72ac491cc3c1ba3ccf34f2fd9f8edd1fe5439462ac2e89cb43cd7dc' \
            'https://downloads.openwrt.org/releases/19.07.9/targets/x86/64/openwrt-sdk-19.07.9-x86-64_gcc-7.5.0_musl.Linux-x86_64.tar.xz' >> "$matrix"
          REMOTE_GATE_SDK_COMPAT_MATRIX="$matrix" \
            sh native/run-sdk-compat.sh openwrt-19.07.9-x86_64 "$PWD/native/dist-sdk-19079-x86"

  sdk-build:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        sample: ${{ fromJSON(inputs.sample == 'all' && '["openwrt-19.07.9-armvirt-64","openwrt-19.07.10-x86_64","openwrt-19.07.10-x86-geode","openwrt-19.07.10-ramips-mt76x8","openwrt-19.07.10-ar71xx-generic","openwrt-21.02.7-x86_64","openwrt-24.10.5-x86_64","openwrt-25.12.5-x86_64","immortalwrt-24.10.5-x86_64"]' || format('["{0}"]', inputs.sample)) }}
    steps:
      - uses: actions/checkout@v4

      - name: Install SDK runtime tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xz-utils zstd file qemu-user

      - name: Build and smoke SDK mapper
        shell: bash
        run: |
          set -euo pipefail
          sh native/run-sdk-compat.sh "${{ matrix.sample }}" "$PWD/native/dist-sdk"

      - name: Upload SDK candidate
        uses: actions/upload-artifact@v4
        with:
          name: remote-gate-mapper-${{ matrix.sample }}-${{ github.sha }}
          path: native/dist-sdk/remote-gate-mapper-*
          if-no-files-found: error
          retention-days: 14
