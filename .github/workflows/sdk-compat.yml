name: SDK Compatibility (manual)

on:
  workflow_dispatch:
    inputs:
      sample:
        description: SDK sample to validate
        required: true
        default: all
        type: choice
        options:
          - all
          - openwrt-19.07.9-armvirt-64
          - openwrt-19.07.10-x86_64
          - openwrt-19.07.10-x86-geode
          - openwrt-19.07.10-ramips-mt76x8
          - openwrt-19.07.10-ar71xx-generic
          - openwrt-21.02.7-x86_64
          - openwrt-24.10.5-x86_64
          - openwrt-25.12.5-x86_64
          - immortalwrt-24.10.5-x86_64

permissions:
  contents: read

concurrency:
  group: sdk-compat-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sdk-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        sample: ${{ fromJSON(inputs.sample == 'all' && '["openwrt-19.07.9-armvirt-64","openwrt-19.07.10-x86_64","openwrt-19.07.10-x86-geode","openwrt-19.07.10-ramips-mt76x8","openwrt-19.07.10-ar71xx-generic","openwrt-21.02.7-x86_64","openwrt-24.10.5-x86_64","openwrt-25.12.5-x86_64","immortalwrt-24.10.5-x86_64"]' || format('["{0}"]', inputs.sample)) }}
    steps:
      - uses: actions/checkout@v4

      - name: Install SDK runtime tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xz-utils zstd file qemu-user

      - name: Build and smoke SDK mapper
        shell: bash
        run: |
          set -euo pipefail
          sh native/run-sdk-compat.sh "${{ matrix.sample }}" "$PWD/native/dist-sdk"

      - name: Upload SDK candidate
        uses: actions/upload-artifact@v4
        with:
          name: remote-gate-mapper-${{ matrix.sample }}-${{ github.sha }}
          path: native/dist-sdk/remote-gate-mapper-*
          if-no-files-found: error
          retention-days: 14
